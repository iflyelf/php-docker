name: 更新 PHP 及扩展版本号

# 说明: 本工作流仅负责"检查并提交版本号"。
#       实际构建工作流 docker-publish.yml 在构建前也会执行同一份脚本
#       (scripts/update-version.sh), 因此即使本工作流未运行, 镜像也不会用旧版本号构建。

# 设置触发条件
on:
  # 定时检查(中国时间每天早4点, UTC 前一天20点; 早于镜像构建的5点)
  schedule:
    - cron: '0 20 * * *'
  # 手动触发
  workflow_dispatch:
    inputs:
      reason:
        description: 'update php & pecl extensions version'
        required: false
        default: 'manual check'

# 同一分支仅保留最新一次检查
concurrency:
  group: update-version-${{ github.ref }}
  cancel-in-progress: true

jobs:
  update-version:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write

    steps:
    - name: 检出代码
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: 检查并更新版本号
      run: bash scripts/update-version.sh

    - name: 提交更新
      if: env.CHANGED == '1'
      run: |
        git config user.name "github-actions[bot]"
        git config user.email "github-actions[bot]@users.noreply.github.com"
        git add Dockerfile conf/php/etc/php.ini
        git commit -m "chore: 自动更新 PHP 及扩展版本号${SUMMARY}"
        git push

    - name: 删除旧的GitHub-workflow
      uses: Mattraks/delete-workflow-runs@main
      with:
        repository: ${{ github.repository }}
        retain_days: 1
        keep_minimum_runs: 3    #保留多少个workflow不删除
