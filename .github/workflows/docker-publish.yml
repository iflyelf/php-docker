name: 自动编译并上传镜像

# 镜像推送目标（华为云 SWR: 国内可访问, 与 Docker Hub 同时推送）
# 组织名称可直接修改, 凭据通过 Secrets: SWR_USERNAME / SWR_PASSWORD
env:
  SWR_REGISTRY: swr.cn-east-3.myhuaweicloud.com
  SWR_ORGANIZATION: iflyelf

# 设置触发条件
on:
  # 编辑文件触发开始编译
  push:
    paths:
      - 'Dockerfile'
      - 'conf/**'
      - 'scripts/**'
      - '.github/workflows/docker-publish.yml'
  # 手动触发工作流
  workflow_dispatch:
    inputs:
      build:
        description: 'build php'
        required: true
        default: 'build php'
  # 定时触发编译(中国时间每天早5点, UTC 前一天21点)
  schedule:
    - cron: '0 21 * * *'
  # 点☆Star触发开始编译
  watch:
     types: [started]

# 同一分支仅保留最新一次构建：快速连续提交时自动取消旧构建，
# 避免多个多架构（QEMU）构建并发堆积、互相拖慢导致镜像迟迟不更新。
concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: true

 # 任务集
jobs:
  build:
    # 选择虚拟环境
    runs-on: ubuntu-latest
    # 多架构 PHP 编译较慢(arm64 走 QEMU), 首次构建可能 2~3 小时, 超时兜底
    timeout-minutes: 300
    if: github.event_name == 'schedule' || github.event.repository.owner.id == github.event.sender.id
    strategy:
      fail-fast: false
      matrix:
        include:
          - DOCKER_TAG: latest

    # 权限(contents: write 用于提交版本号更新)
    permissions:
      actions: write
      contents: write

    # 运行步骤
    steps:

    # 检出master分支
    - name: 检出各个模块代码
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    # 关键: 先同步 PHP / PECL 最新版本号, 再构建, 避免版本号不是最新
    - name: 同步 PHP / PECL 最新版本号(先更新, 再构建)
      run: bash scripts/update-version.sh

    - name: 提交版本号更新
      if: env.CHANGED == '1'
      run: |
        git config user.name "github-actions[bot]"
        git config user.email "github-actions[bot]@users.noreply.github.com"
        git add Dockerfile conf/php/etc/php.ini
        git commit -m "chore: 自动更新 PHP 及扩展版本号${SUMMARY}"
        # 推送失败不影响本次构建(镜像仍基于更新后的本地文件构建)
        git push || echo "::warning::版本更新推送失败, 本次构建仍使用更新后的本地文件"

    # 从 Dockerfile 读取当前 PHP 版本, 作为附加镜像标签
    - name: 读取 PHP 版本号
      id: phpver
      run: |
        PHP_VERSION=$(grep -oP '^ARG PHP_VERSION=\K.*' Dockerfile | head -1)
        echo "检测到 PHP 版本: ${PHP_VERSION}"
        echo "version=${PHP_VERSION}" >> "$GITHUB_OUTPUT"

    - name: 安装 QEMU
      uses: docker/setup-qemu-action@v3
      with:
        platforms: all

    - name: 安装 docker buildx
      id: buildx
      uses: docker/setup-buildx-action@v3
      with:
        version: latest

    - name: 登录 DockerHub
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}

    - name: 登录华为云 SWR
      uses: docker/login-action@v3
      with:
        registry: ${{ env.SWR_REGISTRY }}
        username: ${{ secrets.SWR_USERNAME }}
        password: ${{ secrets.SWR_PASSWORD }}

    - name: 构建镜像并发布
      uses: docker/build-push-action@v6
      # 华为云 SWR 不支持 OCI media types 与证明清单(attestation)，
      # 否则报 "Invalid image, fail to parse 'manifest.json'"。
      # 关闭 provenance/sbom 并输出 Docker 媒体类型以兼容 SWR。
      #
      # 缓存策略: mode=max 可复用 PHP 编译层, 之后版本没变时构建只需几分钟;
      # ignore-error=true 避免缓存导出失败拖垮整个构建(本次即卡在缓存导出)。
      with:
        context: .
        file: ./Dockerfile
        platforms: linux/amd64,linux/arm64
        push: true
        provenance: false
        sbom: false
        outputs: type=image,oci-mediatypes=false
        tags: |
          ${{ secrets.DOCKER_USERNAME }}/php:${{ matrix.DOCKER_TAG }}
          ${{ secrets.DOCKER_USERNAME }}/php:${{ steps.phpver.outputs.version }}
          ${{ env.SWR_REGISTRY }}/${{ env.SWR_ORGANIZATION }}/php:${{ matrix.DOCKER_TAG }}
          ${{ env.SWR_REGISTRY }}/${{ env.SWR_ORGANIZATION }}/php:${{ steps.phpver.outputs.version }}
        cache-from: type=gha
        cache-to: type=gha,mode=max,ignore-error=true

    # 华为云 SWR 镜像仓库默认私有，push 后调用 SWR API 设为公开
    # 需 Secrets: SWR_AK / SWR_SK（华为云账号 AK/SK，具备 swr:repo:updateRepo 权限）
    - name: 设置 SWR 镜像为公开
      env:
        CLOUD_SDK_AK: ${{ secrets.SWR_AK }}
        CLOUD_SDK_SK: ${{ secrets.SWR_SK }}
        SWR_REGION: cn-east-3
        SWR_ORGANIZATION: ${{ env.SWR_ORGANIZATION }}
      run: |
        if [ -z "$CLOUD_SDK_AK" ] || [ -z "$CLOUD_SDK_SK" ]; then
          echo "未配置 SWR_AK / SWR_SK，跳过设置公开"
          exit 0
        fi
        pip install --quiet huaweicloudsdkcore huaweicloudsdkswr
        python - <<'PY'
        import os
        from huaweicloudsdkcore.auth.credentials import BasicCredentials
        from huaweicloudsdkswr.v2.region.swr_region import SwrRegion
        from huaweicloudsdkswr.v2 import SwrClient
        from huaweicloudsdkswr.v2.model import UpdateRepoRequest, UpdateRepoRequestBody

        client = SwrClient.new_builder() \
            .with_credentials(BasicCredentials(os.environ["CLOUD_SDK_AK"], os.environ["CLOUD_SDK_SK"])) \
            .with_region(SwrRegion.value_of(os.environ["SWR_REGION"])) \
            .build()

        namespace = os.environ["SWR_ORGANIZATION"]
        for repository in ["php"]:
            req = UpdateRepoRequest()
            req.namespace = namespace
            req.repository = repository
            req.body = UpdateRepoRequestBody(is_public=True)
            client.update_repo(req)
            print(f"✅ 已设为公开: {namespace}/{repository}")
        PY

    - name: 删除旧的GitHub-workflow
      uses: Mattraks/delete-workflow-runs@main
      with:
        repository: ${{ github.repository }}
        retain_days: 1
        keep_minimum_runs: 3    #保留多少个workflow不删除
